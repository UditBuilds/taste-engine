[project]
name = "taste-engine"
version = "0.1.0"
description = "Single-user music recommender trained on implicit feedback from YouTube watch history"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "lxml>=5.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "python-dotenv>=1.0",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "sentence-transformers>=3.0",
]

[project.scripts]
taste-engine = "taste_engine.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
